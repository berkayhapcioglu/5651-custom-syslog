name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install xz
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Fuzz (short)
        run: |
          go test ./internal/colz/ -run XXX -fuzz FuzzRoundTrip -fuzztime 60s
          go test ./internal/colz/ -run XXX -fuzz FuzzDecode -fuzztime 60s
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -exclude=G104 ./...
      - name: Build .deb
        run: scripts/build-deb.sh "0.1.0~ci${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
